# SPDX-License-Identifier: GPL-3.0-or-later
# Qualify and publish canonical Common V2 reader and embedded freestanding ELF.
name: Qualify and release PFS3 Common V2 reader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev cpio busybox-static curl unzip
      - name: Qualify portable source-owned V2 ELF
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          bootstrap="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          test -s "$bootstrap"
          test "$(wc -c < "$bootstrap")" -lt 8192
          if grep -aF '__IFS_SOURCE_PAYLOAD_BELOW__' "$bootstrap"; then exit 1; fi
          grep -F "$GITHUB_SHA" "$bootstrap"
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.ko' | wc -l)" = 0
          mkdir -p "$RUNNER_TEMP/portable"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable"
          test "$(find "$RUNNER_TEMP/portable" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/portable/System/Filesystems/PFS3.so"
      - name: Qualify native source-first RUN
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -name '*.run' -print -quit)"
          bash "$installer" --profile aggressive --build-only --output "$RUNNER_TEMP/native"
          deb="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          python3 standalone/check-package.py "$deb" --profile aggressive
          mkdir -p "$RUNNER_TEMP/root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/root"
          test "$(find "$RUNNER_TEMP/root" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/root/System/Filesystems/PFS3.so"
          test "$(find "$RUNNER_TEMP/root" -name '*.ko' | wc -l)" = 0
      - name: Validate exact source-owned freestanding reader in both packages
        run: |
          set -euo pipefail
          bash tests/check-freestanding-v2.sh "$RUNNER_TEMP/portable/System/Filesystems/PFS3.so"
          bash tests/check-freestanding-v2.sh "$RUNNER_TEMP/root/System/Filesystems/PFS3.so"
      - name: Read independently formatted PFS boot media through both packages
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pfs-test"
          mkdir -p "$work/files/boot"
          bash tests/boot-file-fixtures.sh "$work/files/boot"
          bash tests/independent-image.sh "$work/tools" "$work/files/boot" "$work/pfs.img"
          git clone -q https://github.com/Infiltrator-Projects/Libraries "$work/common"
          git -C "$work/common" checkout -q d23a52693fd3212368d327e1c1302e07ae9510ec
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -I"$work/common/include" tests/test_namespace_media.c -ldl -o "$work/read"
          for profile in portable root; do
            bash tests/packaged-media.sh "$work/read" "$RUNNER_TEMP/$profile/System/Filesystems/PFS3.so" "$work/pfs.img" "$work/files"
          done
      - name: Verify new PFS1 media through both packaged formatters
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pfs-test"
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -I"$work/common/include" tests/test_format.c -ldl -o "$work/format"
          for profile in portable root; do
            sh tests/format_media.sh "$work/format" "$RUNNER_TEMP/$profile/System/Filesystems/PFS3.so"
          done
      - name: Determine whether the version needs publishing
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          existing=$(git ls-remote --tags --refs origin "refs/tags/$tag")
          if [[ -n "$existing" ]]; then
            test "$(gh release view "$tag" --json tagName --jq .tagName)" = "$tag"
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_version=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pfs3-common-v2-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: needs.qualify.outputs.new_version == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pfs3-common-v2-qualified-${{ github.sha }}
          path: dist
      - name: Publish immutable PFS3 Common V2 .deb and native .run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" = 2
          test "$(find dist -name '*.ko' -o -name '*.efi' | wc -l)" = 0
          (cd dist && sha256sum -- *.deb *.run) > "$RUNNER_TEMP/hashes.txt"
          if gh release view "$tag" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            test "$target" = "$GITHUB_SHA" || { echo "Existing release belongs to another commit" >&2;exit 1; }
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Existing tag without qualified release" >&2;exit 1
          else
            gh release create "$tag" dist/*.deb dist/*.run --target "$GITHUB_SHA" \
              --title "PFS3 Common V2 filesystem reader $version" \
              --notes "Native Common V2 PFS3.so with embedded, import-free freestanding ELF. V2 core and read-only filesystem tests pass. No separate kernel driver, EFI driver or obsolete ABI."
          fi
          mkdir -p "$RUNNER_TEMP/verified"
          gh release download "$tag" -p '*.deb' -p '*.run' --dir "$RUNNER_TEMP/verified"
          (cd "$RUNNER_TEMP/verified" && sha256sum -c "$RUNNER_TEMP/hashes.txt")
