# SPDX-License-Identifier: GPL-3.0-or-later
name: Qualify PFS3 Common V2-only hosted module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pfs3-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test real V2 on-media decoder and volume sessions
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Check installed library only exports V2, no kernel fallback
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          cmp build/PFS3.so "$stage/System/Filesystems/PFS3.so"
          bash tests/check_v2_exports.sh "$stage/System/Filesystems/PFS3.so"
          test -s "$stage/System/Resources/Documentation/Filesystem-PFS3.pdf"
          test "$(find "$stage" -name '*.ko' | wc -l)" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: PFS3-hosted-v2-not-BOOT-qualified
          path: build/PFS3.so
