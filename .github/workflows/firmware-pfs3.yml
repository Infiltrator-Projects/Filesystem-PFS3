# SPDX-License-Identifier: GPL-3.0-or-later
# Source-owned PFS3 freestanding V2 engineering gate; no release or ESP writes.
name: Qualify PFS3 freestanding Common V2 ELF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pfs3-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler, Common and ELF validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils cmake git libssl-dev
      - name: Compile exact canonical PFS3 reader without libc
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake -S module/firmware -B build/firmware \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCOMMON_INCLUDE_DIR=$PWD/build/_deps/infiltratr_common-src/include"
          cmake --build build/firmware --parallel 2
          firmware=build/firmware/PFS3.so
          test -s "$firmware"
          nm -D --defined-only "$firmware" | grep -F infiltrator_filesystem_api_v2
          ! nm -u "$firmware" | grep .
          ! readelf -dW "$firmware" | grep -F '(NEEDED)'
          ! nm -D "$firmware" | grep -E 'infiltrator_filesystem_.*_v1'
      - name: Verify same reader is embedded unchanged in installed PFS3.so
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          # An empty test inventory must never qualify a firmware candidate.
          ctest --test-dir build -N | grep -F 'pfs3-real-direct-index-v2-reader'
          ctest --test-dir build -N | grep -F 'pfs3-v2-multivolume-probe-mount'
          DESTDIR="$RUNNER_TEMP/installed" cmake --install build
          module="$RUNNER_TEMP/installed/System/Filesystems/PFS3.so"
          test -s "$module"
          readelf -SW "$module" | grep -F .infiltrator_boot
          objcopy --dump-section ".infiltrator_boot=$RUNNER_TEMP/actual.elf" "$module"
          cmp "$RUNNER_TEMP/actual.elf" build/firmware/PFS3.so
          ! nm -D --defined-only "$module" | grep -E 'infiltrator_filesystem_.*_v1'
          test "$(find "$RUNNER_TEMP/installed" -type f | wc -l)" -eq 2
          ! find "$RUNNER_TEMP/installed" -name '*.ko' | grep .
          echo PFS3_RELEASE_SO_EMBEDS_IDENTICAL_FREESTANDING_ELF
      - name: Qualify using unmodified BOOT 0.1.77 production validator
        shell: bash
        run: |
          set -euo pipefail
          boot=infiltrator-boot_0.1.77_amd64.deb
          curl -fsSL --retry 3 \
            "https://github.com/Infiltrator-Projects/Boot/releases/download/v0.1.77/$boot" \
            -o "$RUNNER_TEMP/$boot"
          printf '%s  %s\n' \
            c70fd0bec2d6a2728e9ceddb4149c58ef63955ecfe42184a18ea960ede6a1c5c \
            "$RUNNER_TEMP/$boot" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$boot" "$RUNNER_TEMP/boot"
          validator="$RUNNER_TEMP/boot/usr/lib/infiltrator-boot/validate-module"
          if [[ ! -x "$validator" ]]; then
            echo "Production BOOT 0.1.77 no longer supplies validate-module; PFS3 qualification blocked" >&2
            exit 1
          fi
          "$validator" build/firmware/PFS3.so
          echo PFS3_FREESTANDING_V2_PRODUCTION_VALIDATOR_PASS
